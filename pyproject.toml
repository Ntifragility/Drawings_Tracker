[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawings-tracker"
version = "0.1.0"
description = "Local drawing tracker for comparing status exports and tracking changes"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "selenium>=4.20,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
